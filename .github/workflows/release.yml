name: Release

# 发版约定（详见 DOCKER_DEPLOY.md「版本与发版约定」）：
# - 组件 tag 携带版本号，必须与仓库内对应文件一致，由 verify_versions 把关：
#     backend/v1.6.0   -> backend/pyproject.toml（并要求 backend/uv.lock 同步）
#     frontend/v1.5.5  -> frontend/package.json
#     electron/v0.1.0  -> electron/package.json
#     android/v1.0.0   -> package.json（根目录，Capacitor 壳）+ android/app/build.gradle
# - xmem/* 是「整体发布批次」，不是版本号：可以写 xmem/v1.5.2（历史格式），
#   也可以写 xmem/2026.10.28（推荐的日期格式）。它只决定本次一起发布哪些镜像，
#   不对应任何文件里的版本，因此不做版本比对。
on:
  push:
    tags:
      - "frontend/v*"
      - "backend/v*"
      - "electron/v*"
      - "android/v*"
      - "xmem/*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # 紧急情况下可临时改成 "true" 跳过版本校验；发布完记得改回来
  SKIP_VERSION_CHECK: "false"

jobs:
  # 发布前的闸门：tag 声明的版本必须和仓库文件里的版本一致，否则直接失败
  verify_versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与组件版本一致
        if: ${{ env.SKIP_VERSION_CHECK != 'true' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ.get("TAG_NAME", "").strip()
          prefix, sep, version = tag.partition("/")
          if not sep or not prefix or not version:
              sys.exit(f"[版本校验] 无法解析 tag：{tag!r}（应形如 backend/v1.6.0 或 xmem/2026.10.28）")

          # tag 允许带 v 前缀（backend/v1.6.0），也接受不带（backend/1.6.0），比较前统一去掉
          if version[:1] in ("v", "V"):
              version = version[1:]

          root = pathlib.Path(".")


          def json_version(rel: str) -> str:
              """读取 package.json 的 version 字段。"""
              try:
                  data = json.loads((root / rel).read_text(encoding="utf-8"))
              except FileNotFoundError:
                  return ""
              return str(data.get("version", "")).strip()


          def pyproject_version(rel: str) -> str:
              """读取 pyproject.toml 的 [project].version。"""
              try:
                  with (root / rel).open("rb") as fh:
                      data = tomllib.load(fh)
              except FileNotFoundError:
                  return ""
              return str((data.get("project") or {}).get("version", "")).strip()


          def uv_lock_version(rel: str, package: str) -> str:
              """读取 uv.lock 中某个包的版本（用于确认锁文件已同步）。"""
              try:
                  with (root / rel).open("rb") as fh:
                      data = tomllib.load(fh)
              except FileNotFoundError:
                  return ""
              for item in data.get("package", []):
                  if item.get("name") == package:
                      return str(item.get("version", "")).strip()
              return ""


          def gradle_version_name(rel: str) -> str:
              """读取 android/app/build.gradle 里的 versionName。"""
              try:
                  text = (root / rel).read_text(encoding="utf-8")
              except FileNotFoundError:
                  return ""
              matched = re.search(r'versionName\s+"([^"]+)"', text)
              return matched.group(1).strip() if matched else ""


          # tag 前缀 -> [(描述, 文件, 读取函数)]
          COMPONENTS = {
              "backend": [("backend", "backend/pyproject.toml", pyproject_version)],
              "frontend": [("frontend", "frontend/package.json", json_version)],
              "electron": [("electron", "electron/package.json", json_version)],
              "android": [
                  ("android(壳)", "package.json", json_version),
                  ("android(APK)", "android/app/build.gradle", gradle_version_name),
              ],
          }

          if prefix == "xmem":
              print(f"[版本校验] {tag} 是整体发布批次，不做版本比对。当前各组件版本：")
              for _, readers in COMPONENTS.items():
                  for label, rel, reader in readers:
                      print(f"  - {label}: {reader(rel) or '(未读取到)'}  ({rel})")
              print(f"  - backend(锁文件): {uv_lock_version('backend/uv.lock', 'xmem-backend') or '(未读取到)'}  (backend/uv.lock)")
              sys.exit(0)

          readers = COMPONENTS.get(prefix)
          if readers is None:
              sys.exit(f"[版本校验] 未知的 tag 前缀：{prefix}（支持 backend/frontend/electron/android/xmem）")

          failures = []
          for label, rel, reader in readers:
              actual = reader(rel)
              if not actual:
                  failures.append(f"{rel} 里读不到版本号")
              elif actual != version:
                  failures.append(f"{rel} 是 {actual}，但 tag 声明的是 {version}")

          if prefix == "backend":
              locked = uv_lock_version("backend/uv.lock", "xmem-backend")
              if not locked:
                  failures.append("backend/uv.lock 里找不到 xmem-backend 的版本（可能没执行 uv lock）")
              elif locked != version:
                  failures.append(f"backend/uv.lock 里是 {locked}，与 tag 的 {version} 不一致（会导致 uv sync --frozen 构建失败）")

          if failures:
              print("[版本校验] 失败：")
              for item in failures:
                  print(f"  - {item}")
              print("")
              print(f"tag：{tag}")
              print("请先把对应文件里的版本号改成与 tag 一致并提交，再重新打 tag。")
              print("如确需跳过，把 .github/workflows/release.yml 顶部的 SKIP_VERSION_CHECK 临时改成 \"true\"。")
              sys.exit(1)

          labels = "、".join(label for label, _, _ in readers)
          print(f"[版本校验] 通过：{tag} 与 {labels} 一致")
          PY

  # 后端与前端并行构建：之前串行跑要 10~50 分钟，且 registry 缓存能跳过 apt/pip/npm 下载
  build_backend:
    needs: verify_versions
    if: ${{ startsWith(github.ref_name, 'backend/') || startsWith(github.ref_name, 'xmem/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: tags
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#*/}"
          prefix="${tag%%/*}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ACR="crpi-j2b0x85nywvlumt9.cn-shanghai.personal.cr.aliyuncs.com/xchkoo"
          tags="ghcr.io/${owner}/xmem:${version}-backend,${ACR}/xmem-backend:${version}"
          if [ "$prefix" = "xmem" ]; then
            tags="${tags},ghcr.io/${owner}/xmem:latest-backend,${ACR}/xmem-backend:latest"
          fi
          echo "TAGS=${tags}" >> "$GITHUB_OUTPUT"
          echo "CACHE=ghcr.io/${owner}/xmem:buildcache-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-j2b0x85nywvlumt9.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          # 阿里云 ACR 不支持 buildx 默认附带的 OCI provenance/sbom 清单
          # （denied: unknown manifest class for application/vnd.oci.empty.v1+json），必须关掉
          provenance: false
          sbom: false
          # runner 在海外，走官方源比走阿里云镜像快得多；本地/境内构建仍用默认的 CN 镜像
          build-args: |
            CN_MIRROR=false
            UV_INDEX_URL=https://pypi.org/simple
            UV_EXTRA_INDEX_URL=https://pypi.org/simple
          cache-from: type=registry,ref=${{ steps.tags.outputs.CACHE }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.CACHE }},mode=max

  build_frontend:
    needs: verify_versions
    if: ${{ startsWith(github.ref_name, 'frontend/') || startsWith(github.ref_name, 'xmem/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute frontend image tags
        id: tags
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#*/}"
          prefix="${tag%%/*}"
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ACR="crpi-j2b0x85nywvlumt9.cn-shanghai.personal.cr.aliyuncs.com/xchkoo"
          tags="ghcr.io/${owner}/xmem:${version}-frontend,${ACR}/xmem-frontend:${version}"
          if [ "$prefix" = "xmem" ]; then
            tags="${tags},ghcr.io/${owner}/xmem:latest-frontend,${ACR}/xmem-frontend:latest"
          fi
          echo "TAGS=${tags}" >> "$GITHUB_OUTPUT"
          echo "CACHE=ghcr.io/${owner}/xmem:buildcache-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-j2b0x85nywvlumt9.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          # 同后端：关掉 provenance/sbom，否则 ACR 拒绝该 manifest
          provenance: false
          sbom: false
          build-args: |
            VITE_API_URL=/api
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=registry,ref=${{ steps.tags.outputs.CACHE }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.CACHE }},mode=max

  github_release:
    # 必须等镜像推送完成再创建 release：deploy.yml 由本工作流完成事件触发，
    # 这里若与构建并行，服务器会在新镜像推上去之前就 docker compose pull，
    # 结果拉到上一版 latest。electron/android 不构建镜像（对应 job 被 skipped），此时照常发布。
    needs: [verify_versions, build_backend, build_frontend]
    if: ${{ !cancelled() && needs.verify_versions.result == 'success' && (needs.build_backend.result == 'success' || needs.build_backend.result == 'skipped') && (needs.build_frontend.result == 'success' || needs.build_frontend.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute release name
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          name="$tag"
          case "$tag" in
            frontend/*) name="frontend ${tag#frontend/}" ;;
            backend/*) name="backend ${tag#backend/}" ;;
            electron/*) name="electron ${tag#electron/}" ;;
            android/*) name="android ${tag#android/}" ;;
            xmem/*) name="xmem ${tag#xmem/}" ;;
          esac
          echo "RELEASE_NAME=$name" >> "$GITHUB_ENV"

      - name: Compute umbrella release body (xmem tag)
        if: startsWith(github.ref_name, 'xmem/')
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path('.')

          def read_json(path: pathlib.Path) -> str:
              with path.open('r', encoding='utf-8') as f:
                  return json.load(f).get('version', '').strip()

          def read_backend_version(path: pathlib.Path) -> str:
              try:
                  import tomllib  # py>=3.11
              except Exception:  # pragma: no cover
                  import tomli as tomllib
              with path.open('rb') as f:
                  data = tomllib.load(f)
              return (data.get('project') or {}).get('version', '').strip()

          frontend_version = read_json(root / 'frontend' / 'package.json')
          electron_version = read_json(root / 'electron' / 'package.json')
          backend_version = read_backend_version(root / 'backend' / 'pyproject.toml')
          android_version = read_json(root / 'package.json')

          tag = os.environ.get('GITHUB_REF_NAME', '').strip()

          body = "\n".join([
              f"发布批次：{tag}",
              "",
              "本批次各组件版本：",
              f"- frontend: v{frontend_version}",
              f"- backend: v{backend_version}",
              f"- electron: v{electron_version}",
              f"- android: v{android_version}",
          ])

          env_path = os.environ.get('GITHUB_ENV')
          if not env_path:
              print(body)
              sys.exit(0)

          with open(env_path, 'a', encoding='utf-8') as f:
              f.write("RELEASE_BODY<<__EOF__\n")
              f.write(body)
              f.write("\n__EOF__\n")
          PY

      - name: Create GitHub release (component tag)
        if: ${{ !startsWith(github.ref_name, 'xmem/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          make_latest: false

      - name: Create GitHub release (xmem tag)
        if: startsWith(github.ref_name, 'xmem/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          generate_release_notes: true
          make_latest: false
